name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN_NAME="printctl"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="printctl.exe"
          fi
          go build -ldflags="-s -w" -o "dist/${BIN_NAME}" ./cmd/printctl

          cd dist
          ARCHIVE_NAME="printctl_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE_NAME="printctl_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            zip "${ARCHIVE_NAME}" "${BIN_NAME}"
          else
            tar -czf "${ARCHIVE_NAME}" "${BIN_NAME}"
          fi
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/printctl_${{ matrix.goos }}_${{ matrix.goarch }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
